name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          # The same code is also published as its own sites: hippaa-hub.github.io/maths-prep/ (only the maths app)
          # and hippaa-hub.github.io/exam-prepSCI/ (only the science app).
          path: ${{ github.repository == 'hippaa-hub/maths-prep' && 'dist/maths' || github.repository == 'hippaa-hub/exam-prepSCI' && 'dist/science' || 'dist' }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
